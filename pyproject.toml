[build-system]
requires = ["hatchling==1.27.0", "editables==0.5"]
build-backend = "hatchling.build"

[project]
name = "iris-oek-sn"
version = "0.1.0"
description = "Staging-only Saxony compensation parcel WFS demonstrator"
requires-python = ">=3.11"
dependencies = [
  "requests==2.32.5", "defusedxml==0.7.1", "geopandas==1.1.1",
  "shapely==2.1.2", "pyproj==3.7.2", "psycopg[binary]==3.2.12",
]

[project.optional-dependencies]
test = ["pytest==8.4.2", "responses==0.25.8", "ruff==0.14.3", "hatchling==1.27.0", "editables==0.5"]

[project.scripts]
iris-oek = "iris_oek.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["iris_oek"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires an isolated PostGIS database"]

[tool.ruff]
target-version = "py311"
line-length = 100
