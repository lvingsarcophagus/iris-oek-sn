name: IRIS-OEK-SN checks
on:
  push:
    paths: ['iris_oek/**', 'tests/**', 'scripts/**', 'sql/**', 'Dockerfile', 'docker-compose.yml', 'pyproject.toml', 'uv.lock', 'requirements.lock', 'config*.json', 'README.md', '.gitignore', '.dockerignore', '.github/workflows/iris-oek-sn.yml']
  pull_request:
    paths: ['iris_oek/**', 'tests/**', 'scripts/**', 'sql/**', 'Dockerfile', 'docker-compose.yml', 'pyproject.toml', 'uv.lock', 'requirements.lock', 'config*.json', 'README.md', '.gitignore', '.dockerignore', '.github/workflows/iris-oek-sn.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: review-copy
    steps:
      - uses: actions/checkout@v4
      - name: Clone public submission into an empty directory
        working-directory: .
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          git -c credential.helper= -c http.https://github.com/.extraheader= clone https://github.com/lvingsarcophagus/iris-oek-sn.git review-copy
          git -C review-copy checkout --detach "$GITHUB_SHA"
          test "$(git -C review-copy rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Lint and formatting
        run: |
          ruff check .
          ruff format --check .
      - name: Follow primary README setup, fixture replay and 36 automated tests
        run: python scripts/verify_readme.py
      - name: Retain clean-clone evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-clone-verification
          path: review-copy/output/review-evidence/
          if-no-files-found: ignore
      - name: Remove isolated test services
        if: always()
        working-directory: .
        run: |
          if [ -f review-copy/.env ]; then
            docker compose --project-directory review-copy -f review-copy/docker-compose.yml down -v
          fi
